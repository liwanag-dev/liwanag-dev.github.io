<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taiwan Mandarin Study Hub · Textbook, Zhuyin, Oral & Written Tests</title>
<style>
@font-face {
  font-family: 'BiauKai';
  src: url('BiauKai.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
:root {
  --bg: #faf9f6; --surface: #fff; --border: #e8e4dc;
  --text: #1a1816; --muted: #7a7570; --accent: #b5793a;
  --accent-light: #f5edd9; --accent-dark: #8a5a28;
  --green: #2d6a4f; --green-light: #d8f3e3;
  --red: #c0392b; --red-light: #fde8e6;
  --blue: #1a5276; --blue-light: #d6eaf8;
  --radius: 10px; --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Georgia', 'Noto Serif TC', serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.app { display: flex; height: 100vh; overflow: hidden; }
/* Sidebar */
.sidebar { width: 240px; min-width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
.sidebar-header { padding: 18px 16px 12px; border-bottom: 1px solid var(--border); }
.sidebar-header h1 { font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--accent-dark); text-transform: uppercase; }
.sidebar-header p { font-size: 11px; color: var(--muted); margin-top: 2px; }
.lesson-list { flex: 1; padding: 8px 0; }
.lesson-btn { width: 100%; background: none; border: none; text-align: left; padding: 10px 16px; cursor: pointer; transition: background .15s; display: flex; align-items: flex-start; gap: 10px; }
.lesson-btn:hover { background: var(--accent-light); }
.lesson-btn.active { background: var(--accent-light); border-right: 3px solid var(--accent); }
.lesson-num { font-size: 11px; color: var(--muted); min-width: 28px; padding-top: 2px; font-family: monospace; }
.lesson-info { flex: 1; }
.lesson-zh { font-size: 14px; color: var(--text); line-height: 1.3; }
.lesson-en { font-size: 11px; color: var(--muted); margin-top: 1px; }
.progress-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
/* Main */
.main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.main-header { padding: 20px 28px 0; border-bottom: 1px solid var(--border); }
.lesson-title-area { margin-bottom: 12px; }
.lesson-title-area .num { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.lesson-title-area h2 { font-size: 26px; margin: 4px 0 2px; }
.lesson-title-area .en { font-size: 14px; color: var(--muted); }
.tabs { display: flex; gap: 0; border-bottom: none; }
.tab { background: none; border: none; padding: 10px 18px; font-size: 13px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; font-family: inherit; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab:hover:not(.active) { color: var(--text); }
.main-body { padding: 24px 28px; flex: 1; }
/* Display toggles */
.display-bar { display: flex; gap: 8px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
.display-bar span { font-size: 12px; color: var(--muted); }
.toggle-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--muted); transition: all .15s; font-family: inherit; }
.toggle-btn.on { background: var(--accent-light); border-color: var(--accent); color: var(--accent-dark); font-weight: 600; }
/* Dialogue */
.dialogue-part-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.part-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 14px; font-size: 12px; cursor: pointer; color: var(--muted); transition: all .15s; font-family: inherit; }
.part-btn.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent-dark); }
.dialogue-line { display: flex; gap: 14px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px; }
.speaker-col { min-width: 80px; padding-top: 2px; }
.speaker-zh { font-size: 14px; font-weight: 600; }
.speaker-en { font-size: 11px; color: var(--muted); }
.speaker-a .speaker-zh { color: var(--accent-dark); }
.speaker-b .speaker-zh { color: var(--blue); }
.line-content { flex: 1; }
.line-zh { font-size: 20px; line-height: 1.5; margin-bottom: 3px; }
.line-py { font-size: 13px; color: var(--muted); font-family: 'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-style: italic; margin-bottom: 2px; }
.line-en { font-size: 13px; color: #888; }
/* Pinyin font — needs a font with proper precomposed tone mark glyphs */
.py { font-family: 'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-style: italic; }
/* Vocab Chinese — BiauKai / DFKai-SB */
.zh-kai { font-family: 'BiauKai', 'DFKai-SB', '標楷體', 'KaiTi', serif; }
/* Vocab */
.vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.vocab-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; cursor: pointer; transition: all .2s; position: relative; }
.vocab-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.vocab-card .v-num { font-size: 10px; color: var(--muted); margin-bottom: 6px; font-family: monospace; }
.vocab-card .v-zh { font-size: 24px; margin-bottom: 4px; font-family: 'BiauKai', 'DFKai-SB', '標楷體', 'KaiTi', serif; }
.vocab-card .v-py { font-size: 12px; color: var(--accent-dark); margin-bottom: 2px; font-family: 'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-style: italic; }
.vocab-card .v-pos { font-size: 10px; color: var(--muted); background: var(--bg); border-radius: 4px; padding: 1px 5px; display: inline-block; margin-bottom: 4px; }
.vocab-card .v-en { font-size: 13px; color: var(--text); font-family: Georgia, serif; }
.vocab-card.flipped { background: var(--accent-light); }
.vocab-card .v-ex { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); line-height: 1.5; font-family: 'BiauKai', 'DFKai-SB', '標楷體', serif; }
/* Flashcard */
.flashcard-wrap { max-width: 480px; margin: 0 auto; }
.flashcard { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px 30px; text-align: center; cursor: pointer; min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background .2s; box-shadow: var(--shadow); }
.flashcard:hover { border-color: var(--accent); }
.flashcard .fc-zh { font-size: 56px; line-height: 1.2; margin-bottom: 12px; font-family: 'BiauKai', 'DFKai-SB', '標楷體', 'KaiTi', serif; }
.flashcard .fc-py { font-size: 18px; color: var(--accent-dark); margin-bottom: 8px; font-family: 'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-style: italic; }
.flashcard .fc-pos { font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 4px; padding: 2px 8px; margin-bottom: 10px; display: inline-block; }
.flashcard .fc-en { font-size: 18px; font-weight: 600; margin-bottom: 14px; }
.flashcard .fc-ex { font-size: 15px; color: var(--muted); line-height: 1.7; border-top: 1px solid var(--border); padding-top: 14px; width: 100%; text-align: center; font-family: 'BiauKai', 'DFKai-SB', '標楷體', serif; }
.flashcard .hint { font-size: 12px; color: var(--muted); margin-top: 14px; }
.fc-nav { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 18px; }
.fc-nav-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 20px; cursor: pointer; font-size: 14px; transition: all .15s; font-family: inherit; }
.fc-nav-btn:hover:not(:disabled) { background: var(--accent-light); border-color: var(--accent); }
.fc-nav-btn:disabled { opacity: .35; cursor: default; }
.fc-counter { font-size: 13px; color: var(--muted); min-width: 60px; text-align: center; }
/* Quiz */
.quiz-wrap { max-width: 520px; }
.quiz-q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; margin-bottom: 20px; box-shadow: var(--shadow); }
.quiz-q-card .q-zh { font-size: 52px; margin-bottom: 8px; }
.quiz-q-card .q-py { font-size: 16px; color: var(--muted); font-style: italic; }
.quiz-opt { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; text-align: left; cursor: pointer; font-size: 14px; margin-bottom: 8px; transition: all .15s; font-family: inherit; color: var(--text); }
.quiz-opt:hover:not(:disabled) { background: var(--accent-light); border-color: var(--accent); }
.quiz-opt.correct { background: var(--green-light); border-color: var(--green); color: var(--green); font-weight: 600; }
.quiz-opt.wrong { background: var(--red-light); border-color: var(--red); color: var(--red); }
.quiz-opt:disabled { cursor: default; }
.quiz-meta { display: flex; justify-content: space-between; margin-bottom: 18px; font-size: 13px; color: var(--muted); }
.quiz-score { color: var(--accent-dark); font-weight: 600; }
.quiz-done { text-align: center; padding: 40px 20px; }
.quiz-done .score-big { font-size: 52px; font-weight: 700; color: var(--accent-dark); }
.quiz-done .score-label { font-size: 16px; color: var(--muted); margin-bottom: 24px; }
.quiz-done .emoji { font-size: 44px; margin-bottom: 12px; }
/* Grammar */
.grammar-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
.grammar-section h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.grammar-section p { font-size: 14px; color: var(--muted); margin-bottom: 14px; line-height: 1.7; }
.grammar-pattern { background: var(--bg); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; border-left: 3px solid var(--accent); }
.grammar-pattern .pat { font-size: 17px; margin-bottom: 3px; }
.grammar-pattern .pat-en { font-size: 12px; color: var(--muted); font-style: italic; margin-bottom: 4px; }
.grammar-pattern .pat-ex { font-size: 14px; color: var(--accent-dark); }
/* Buttons */
.btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; font-size: 14px; font-family: inherit; transition: background .15s; }
.btn:hover { background: var(--accent-dark); }
.btn-ghost { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px 18px; cursor: pointer; font-size: 13px; font-family: inherit; color: var(--text); transition: all .15s; }
.btn-ghost:hover { background: var(--accent-light); border-color: var(--accent); }
/* Progress */
.progress-bar-wrap { background: var(--border); border-radius: 4px; height: 4px; margin-top: 4px; }
.progress-bar { background: var(--accent); height: 4px; border-radius: 4px; transition: width .3s; }
/* Notes */
.note-box { background: var(--blue-light); border-left: 4px solid var(--blue); border-radius: 0 8px 8px 0; padding: 14px 16px; margin-bottom: 12px; font-size: 13px; line-height: 1.7; color: var(--blue); }
/* Home */
.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.home-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: all .2s; }
.home-card:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-1px); }
.home-card .hc-num { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-family: monospace; }
.home-card .hc-zh { font-size: 18px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
.home-card .hc-en { font-size: 11px; color: var(--muted); }
.home-card .hc-bar { margin-top: 10px; }
.section-title { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
/* Responsive */
@media (max-width: 700px) {
  .sidebar { display: none; }
  .app { flex-direction: column; }
}

/* Integrated study experience */
.mobile-topbar{display:none}
.audio-toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:9px 0 13px;border-top:1px solid var(--border);margin-top:6px}
.audio-toolbar label,.audio-toolbar .audio-status{font:12px system-ui,sans-serif;color:var(--muted)}
.audio-toolbar select{font:12px system-ui,sans-serif;border:1px solid var(--border);border-radius:7px;padding:6px 8px;background:var(--surface);color:var(--text);max-width:190px}
.audio-icon{border:1px solid #ddc6a7;border-radius:8px;background:#fff8eb;color:#855523;min-height:34px;min-width:36px;padding:5px 9px;cursor:pointer;font:13px system-ui,sans-serif;vertical-align:middle}
.audio-icon:hover{background:#f1dfc1}
.audio-icon:focus-visible,.lesson-btn:focus-visible,.btn:focus-visible,.part-btn:focus-visible,.toggle-btn:focus-visible{outline:3px solid #b5793a;outline-offset:2px}
.audio-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dialogue-line.is-speaking{border-color:#b5793a;background:#fdf5e8;box-shadow:inset 3px 0 #b5793a}
.dialogue-line .line-audio{display:flex;align-items:flex-start;padding-top:3px}
.audio-status{font-size:11px;line-height:1.4}
.exam-frame{width:100%;border:0;display:block;height:calc(100vh - 127px);min-height:510px;background:var(--bg)}
.main-body.oral-body{padding:0!important;overflow:hidden;flex:1}
.main.oral-main{overflow:hidden}
.sidebar-heading{padding:13px 16px 4px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--accent-dark);text-transform:uppercase;border-top:1px solid var(--border);margin-top:8px}
.exam-link{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--accent-dark);font:600 12px system-ui,sans-serif;cursor:pointer}
.exam-link:hover{background:var(--accent-light)}
.learning-note{border-left:3px solid var(--accent);padding:12px 15px;background:var(--surface);border-radius:0 9px 9px 0;line-height:1.65;font-size:13px;margin:14px 0}
.vocab-card{cursor:pointer}
.vocab-card:focus-visible,.flashcard:focus-visible{outline:3px solid #b5793a;outline-offset:2px}
.vocab-card .audio-icon{position:absolute;right:9px;top:9px}
.fc-actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.grammar-pattern .patrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.quiz-q-card .audio-icon{margin-top:9px}
@media(max-width:700px){
  .mobile-topbar{display:flex;align-items:center;justify-content:space-between;gap:9px;height:54px;padding:7px 11px;background:var(--surface);border-bottom:1px solid var(--border);font:11px system-ui,sans-serif;color:var(--muted)}
  .mobile-topbar .btn-ghost{font-size:12px;padding:9px 11px}
  .app{height:calc(100vh - 54px);flex-direction:column}
  .sidebar{display:flex;position:fixed;top:54px;left:0;bottom:0;width:min(83vw,310px);min-width:0;z-index:20;transform:translateX(-110%);transition:transform .2s ease;box-shadow:0 8px 25px #0002}
  .sidebar.mobile-open{transform:translateX(0)}
  .main{width:100%;height:100%;overflow-y:auto}
  .main-header{padding:12px 15px 0}
  .main-body{padding:15px}
  .lesson-title-area h2{font-size:21px}
  .tabs{overflow-x:auto;white-space:nowrap}
  .tab{padding:9px 11px}
  .dialogue-line{gap:9px;padding:12px 10px}
  .speaker-col{min-width:62px}
  .line-zh{font-size:17px}
  .exam-frame{height:calc(100vh - 153px);min-height:420px}
  .audio-toolbar{padding:9px 0;gap:6px}
  .audio-toolbar .audio-status{width:100%}
  .vocab-grid{grid-template-columns:repeat(auto-fill,minmax(146px,1fr))}
}
@media(prefers-reduced-motion:reduce){.sidebar,.dialogue-line,.vocab-card{transition:none}}
</style>
</head>

function hasMandarin(t){return /[\u3400-\u9fff]/.test(t||'')}
function audioStatus(message){let e=document.getElementById('speechStatus');if(e)e.textContent=message}
function listedChineseVoices(){if(!('speechSynthesis' in window))return [];return speechSynthesis.getVoices().filter(v=>/^zh([_-]|$)/i.test(v.lang))}
function preferredChineseVoice(){const vs=listedChineseVoices();return vs.find(v=>v.voiceURI===voiceChoice)||vs.find(v=>/^zh[-_]TW$/i.test(v.lang))||vs.find(v=>/zh[-_](HK|MO)/i.test(v.lang))||vs[0]||null}
function refreshVoiceChoices(){const e=document.getElementById('voiceChoice');if(!e)return;const vs=listedChineseVoices();let value=voiceChoice;e.innerHTML='<option value="auto">Auto · zh-TW</option>'+vs.map(v=>`<option value="${encodeURIComponent(v.voiceURI)}">${v.name.replace(/[<>]/g,'')} (${v.lang})</option>`).join('');if(value!=='auto'){const opt=vs.find(v=>v.voiceURI===value);if(opt)e.value=encodeURIComponent(opt.voiceURI)} }
function selectVoice(x){voiceChoice=x==='auto'?'auto':decodeURIComponent(x)}
function setVoiceRate(v){voiceRate=Number(v)||.84;try{localStorage.setItem('pavc_voice_rate',String(voiceRate))}catch{}}
function stopAudio(){speakSequence++;if('speechSynthesis' in window)speechSynthesis.cancel();activeUtterances=[];document.querySelectorAll('.dialogue-line.is-speaking').forEach(e=>e.classList.remove('is-speaking'));audioStatus('Playback stopped')}
function speakSeries(lines){
  if(!('speechSynthesis' in window)){audioStatus('Text-to-speech is not supported in this browser. Try Chrome or Edge.');return}
  stopAudio();const token=speakSequence;
  const vs=listedChineseVoices(),chosen=preferredChineseVoice();
  if(!vs.length){audioStatus('No Mandarin voice was listed; trying the browser default. Install a zh-TW voice for correct pronunciation.');}
  const valid=lines.filter(x=>x&&hasMandarin(x.text));
  if(!valid.length){audioStatus('This item has no Chinese text to pronounce.');return}
  valid.forEach((line,i)=>{
    const utter=new SpeechSynthesisUtterance(line.text);
    utter.lang='zh-TW';utter.voice=chosen;utter.rate=voiceRate;utter.pitch=line.speaker===1?.95:1;
    utter.onstart=()=>{if(token!==speakSequence)return;audioStatus(`Playing ${i+1}/${valid.length} · ${chosen?.name||'Mandarin'}`);document.querySelectorAll('.dialogue-line.is-speaking').forEach(e=>e.classList.remove('is-speaking'));if(line.idx!==undefined){let e=document.querySelector(`[data-dialogue-line="${line.idx}"]`);if(e)e.classList.add('is-speaking')}};
    utter.onend=()=>{if(token!==speakSequence)return;if(i===valid.length-1){audioStatus('Finished. Repeat aloud to practice.');document.querySelectorAll('.dialogue-line.is-speaking').forEach(e=>e.classList.remove('is-speaking'));activeUtterances=[]}};
    utter.onerror=(e)=>{if(token!==speakSequence)return;audioStatus('Audio could not play. Check your speech voice and browser settings.');};
    activeUtterances.push(utter);speechSynthesis.speak(utter);
  });
}
function speakText(text){speakSeries([{text:String(text).trim()}])}
function speakDialogueLine(i){const dl=LESSONS.find(l=>l.id===currentLesson)?.dialogues[dialoguePart];if(!dl||!dl.lines[i])return;speakSeries([{text:dl.lines[i].zh,idx:i,speaker:dl.lines[i].s}])}
function playFullDialogue(){const dl=LESSONS.find(l=>l.id===currentLesson)?.dialogues[dialoguePart];if(!dl)return;speakSeries(dl.lines.map((line,i)=>({text:line.zh,idx:i,speaker:line.s})))}

function speakGrammar(gi,pi,useExample=false){const p=LESSONS.find(l=>l.id===currentLesson)?.grammar[gi]?.patterns[pi];if(!p)return;let t=useExample?p.ex:p.pat;t=t.replace(/\([^)]*\)/g,'').replace(/[A-Za-z]+/g,'').replace(/[_+→]/g,' ').trim();speakText(t)}
function speakNote(i){let l=LESSONS.find(l=>l.id===currentLesson),s=l?.notes[i]||'';speakText((s.match(/[\u3400-\u9fff][\u3400-\u9fff\s，、。！？]*/g)||[]).join('，'))}

function speakZhuyinTone(i){speakText(['媽','麻','馬','罵','嗎'][i]||'媽')}
function speakZDrill(){const l=ZHUYIN_LESSONS.find(x=>x.id===currentZLesson),q=l?.drill?.items[zDrillIdx];if(!q)return;let sound=q.z?(zhSoundExamples[q.z]|| (hasMandarin(q.z)?q.z:'')) : q.desc?.includes('媽')?'媽':q.desc?.includes('馬')?'馬':q.desc?.includes('罵')?'罵':'';if(sound)speakText(sound);else audioStatus('This question tests tone identification. Listen to the four tone examples in Learn.')}
function audioToolbar(){return `<div class="audio-toolbar" role="group" aria-label="Mandarin audio controls"><button type="button" class="audio-icon" onclick="speakText('你好，歡迎學習中文。')">🔊 Test voice</button><label>Speed <select aria-label="Voice speed" onchange="setVoiceRate(this.value)"><option value=".67" ${voiceRate===.67?'selected':''}>Slow</option><option value=".84" ${voiceRate!==.67&&voiceRate!==1?'selected':''}>Practice</option><option value="1" ${voiceRate===1?'selected':''}>Natural</option></select></label><label>Voice <select id="voiceChoice" aria-label="Chinese voice" onchange="selectVoice(this.value)"><option value="auto">Auto · zh-TW</option></select></label><button type="button" class="audio-icon" onclick="stopAudio()">■ Stop</button><span id="speechStatus" class="audio-status" role="status" aria-live="polite">Use the 🔊 buttons to listen and repeat.</span></div>`}

function saveProgress(lid, key, val) {
  if(!progress[lid]) progress[lid]={};
  progress[lid][key]=val;
  try{localStorage.setItem('pavc_progress', JSON.stringify(progress))}catch{}
}

function getLessonProgress(lid) {
  return progress[lid]||{};
}

// --- Shuffle ---
function shuffle(a){return [...a].sort(()=>Math.random()-.5);}

// --- Quiz ---
function makeQuiz(vocab){
  const qs = shuffle(vocab).slice(0,10);
  return qs.map(item=>{
    const wrong = shuffle(vocab.filter(v=>v.zh!==item.zh)).slice(0,3);
    const opts = shuffle([item,...wrong]);
    return {zh:item.zh,py:item.py,correct:item.en,options:opts.map(o=>o.en)};
  });
}

      </div>
    </div>
    <div class="flashcard" role="button" tabindex="0" aria-label="Reveal vocabulary card" onclick="flipCard()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipCard()}">
      ${!vocabFlipped?`
        <div class="fc-zh">${v.zh}</div>
        <div class="hint">tap to reveal</div>
      `:`
        <div class="fc-zh">${v.zh}</div>
        <div class="fc-py">${v.py}</div>
        <span class="fc-pos">${v.pos}</span>
        <div class="fc-en">${v.en}</div>
        ${v.ex?`<div class="fc-ex"><div style="margin-bottom:3px">${v.ex}</div><div style="font-family:Georgia,serif;font-size:12px;color:var(--muted);font-style:italic">${v.exEn}</div></div>`:''}
      `}
    </div>
    <div class="fc-actions"><button type="button" class="audio-icon" onclick="speakVocab(${vocabIdx})">🔊 Hear word</button>${v.ex?`<button type="button" class="audio-icon" onclick="speakVocab(${vocabIdx},true)">🔊 Hear example</button>`:''}</div>
    <div class="fc-nav">
      <button class="fc-nav-btn" onclick="prevCard()" ${vocabIdx===0?'disabled':''}>← Prev</button>
      <span class="fc-counter">${vocabIdx+1} / ${l.vocab.length}</span>
      <button class="fc-nav-btn" onclick="nextCard()" ${vocabIdx===l.vocab.length-1?'disabled':''}>Next →</button>
    </div>
  </div>`;
}

function renderGrammar(b,l){
  b.innerHTML = l.grammar.map((g,gi)=>`
    <div class="grammar-section">
      <h3>${g.title}</h3>
      <p>${g.exp}</p>
      ${g.patterns.map((p,pi)=>`<div class="grammar-pattern">
        <div class="patrow"><div class="pat">${p.pat}</div>${hasMandarin(p.pat)?`<button type="button" class="audio-icon" aria-label="Hear grammar pattern" onclick="speakGrammar(${gi},${pi})">🔊</button>`:''}</div>
        <div class="pat-en">${p.en}</div>
        ${p.ex?`<div class="pat-ex">e.g. ${p.ex} ${hasMandarin(p.ex)?`<button type="button" class="audio-icon" aria-label="Hear example" onclick="speakGrammar(${gi},${pi},true)">🔊</button>`:''}</div>`:''}
      </div>`).join('')}
    </div>
  `).join('');
}

function renderNotes(b,l){
  b.innerHTML = `<p class="section-title">Notes</p>` +
    l.notes.map((n,i)=>`<div class="note-box">${n} ${hasMandarin(n)?`<button type="button" class="audio-icon" aria-label="Listen to Chinese in note" onclick="speakNote(${i})">🔊</button>`:''}</div>`).join('')+examBridge(l)+modernUseNote(l);
}

function renderQuiz(b,l){
  if(!quiz){
    b.innerHTML=`<div style="text-align:center;padding:40px 20px">
      <div style="font-size:48px;margin-bottom:16px">📝</div>
      <p style="font-size:16px;margin-bottom:8px;font-weight:600">Vocabulary Quiz — Lesson ${l.id}</p>
      <p style="font-size:14px;color:var(--muted);margin-bottom:24px">${l.vocab.length} words · 10 questions</p>
      <button class="btn" onclick="initQuiz()">Start Quiz</button>
    </div>`;
    return;
  }
  if(quizDone){
    const pct=quizScore*10;
    const emoji=quizScore>=9?'🎉':quizScore>=7?'👍':quizScore>=5?'📖':'🔄';
    saveProgress(l.id,'quizBest',Math.max(quizScore,(getLessonProgress(l.id).quizBest||0)));
    renderSidebar();
    b.innerHTML=`<div class="quiz-done">
      <div class="emoji">${emoji}</div>
      <div class="score-big">${quizScore} / 10</div>
      <div class="score-label">${pct}% · ${quizScore>=9?'Excellent! 很棒！':quizScore>=7?'Good job! 不錯！':quizScore>=5?'Keep going! 繼續！':'Review and retry! 再試試！'}</div>
      <button class="btn" onclick="initQuiz()" style="margin-right:8px">Try Again</button>
      <button class="btn-ghost" onclick="setTab('vocabulary')">Review Vocab</button>
    </div>`;
    return;
  }
  const q = quiz[quizIdx];
  b.innerHTML=`<div class="quiz-wrap">
    <div class="quiz-meta">
      <span>Question ${quizIdx+1} of ${quiz.length}</span>
      <span class="quiz-score">✓ ${quizScore} correct</span>
    </div>
    <div class="quiz-q-card">
      <div class="q-zh">${q.zh}</div>
      <div class="q-py">${q.py}</div><button type="button" class="audio-icon" aria-label="Listen to quiz word" onclick="speakQuizWord()">🔊 Hear word</button>
    </div>
    ${q.options.map(opt=>{
      let cls='quiz-opt';
      if(quizAns){
        if(opt===q.correct) cls+=' correct';
        else if(opt===quizAns&&opt!==q.correct) cls+=' wrong';
      }
      return `<button class="${cls}" onclick="answerQuiz('${opt.replace(/'/g,"\\'")}');return false;" ${quizAns?'disabled':''}>${opt}</button>`;
    }).join('')}
  </div>`;
}

function render(){
  renderSidebar();
  renderHeader();
  renderBody();
}

// --- Actions ---
function goHome(){ stopAudio();closeMobileNav();zSection='pavc'; currentLesson=0; currentTab='home'; currentZLesson=null; render(); }
function openLesson(id){ stopAudio();closeMobileNav();zSection='pavc'; currentLesson=id; currentTab='dialogue'; dialoguePart=0; vocabIdx=0; vocabFlipped=false; vocabMode='flash'; quiz=null; quizDone=false; render(); }
function setTab(t){ stopAudio();currentTab=t; vocabMode='flash'; vocabIdx=0; vocabFlipped=false; render(); }
function setDialoguePart(i){ stopAudio(); dialoguePart=i; render(); }
function toggleMode(m){ displayModes[m]=!displayModes[m]; renderBody(); }
function flipCard(){ vocabFlipped=!vocabFlipped; renderBody(); }
function prevCard(){ if(vocabIdx>0){vocabIdx--;vocabFlipped=false;renderBody();} }
function nextCard(){ const l=LESSONS.find(x=>x.id===currentLesson); if(vocabIdx<l.vocab.length-1){vocabIdx++;vocabFlipped=false;renderBody();} }
function selectVocab(i){ if(vocabIdx===i){vocabFlipped=!vocabFlipped;}else{vocabIdx=i;vocabFlipped=true;} renderBody(); }
function setVocabMode(m){ vocabMode=m; vocabFlipped=false; renderBody(); }
function startQuiz(){ currentTab='quiz'; initQuiz(); render(); }
function initQuiz(){
  const l=LESSONS.find(x=>x.id===currentLesson);
  quiz=makeQuiz(l.vocab); quizIdx=0; quizScore=0; quizAns=null; quizDone=false;
  renderBody();
}
function answerQuiz(ans){
  if(quizAns) return;
  const q=quiz[quizIdx];
  quizAns=ans;
  if(ans===q.correct) quizScore++;
  renderBody();
  setTimeout(()=>{
    if(quizIdx+1>=quiz.length){quizDone=true;}
    else{quizIdx++;quizAns=null;}
    renderBody();
  },900);
}

// ============================================================
// ZHUYIN RENDER
// ============================================================
function renderZLearn(b, l){
  const html = l.sections.map((s,sectionIdx)=>{
    if(s.type==='intro') return `<div style="font-size:14px;line-height:1.8;color:var(--text);margin-bottom:14px">${s.content}</div>`;
    if(s.type==='note') return `<div class="note-box" style="margin-bottom:14px;font-size:14px">💡 ${s.content}</div>`;
    if(s.type==='list') return `<ul style="margin:0 0 14px 18px;font-size:14px;line-height:2">${s.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    if(s.type==='table'){
      const [head,...rows] = s.rows;
      return `<div style="overflow-x:auto;margin-bottom:16px"><table style="border-collapse:collapse;width:100%;font-size:13px">
        <thead><tr>${head.map(h=>`<th style="padding:8px 12px;text-align:left;background:var(--accent-light);border:1px solid var(--border);font-weight:600;color:var(--accent-dark)">${h}</th>`).join('')}</tr></thead>
        <tbody>${rows.map((r,ri)=>`<tr style="background:${ri%2===0?'var(--surface)':'var(--bg)'}">
          ${r.map((c,ci)=>`<td style="padding:8px 12px;border:1px solid var(--border);${ci===0?'font-size:20px;font-family:\'BiauKai\',serif;':''}${s.rows[0].length===5&&ci===2?'font-size:18px;font-family:\'BiauKai\',serif;':''}${s.rows[0][0]==='Tone'&&ci===4?'font-family:\'BiauKai\',serif;':''}">${c}${s.rows[0][0]==='Tone'&&ci===4?` <button class="audio-icon" type="button" aria-label="Hear tone example" onclick="speakZhuyinTone(${ri})">🔊</button>`:''}</td>`).join('')}
        </tr>`).join('')}</tbody>
      </table></div>`;
    }
    if(s.type==='symbol-group') return `<div style="margin-bottom:18px">
      <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">${s.label}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${s.symbols.map((sym,symIdx)=>`<div style="background:${s.color};border:1px solid var(--border);border-radius:${getComputedStyle(document.documentElement).getPropertyValue('--radius')||'10px'};padding:10px 14px;min-width:90px;text-align:center">
          <div style="font-size:28px;font-family:'BiauKai','DFKai-SB',serif;line-height:1.2;margin-bottom:4px">${sym.z}</div>
          <div style="font-size:12px;font-family:'Noto Sans','Segoe UI',sans-serif;color:var(--accent-dark);font-weight:600;margin-bottom:2px">${sym.py}</div>
          <div style="font-size:11px;color:var(--muted);line-height:1.4">${sym.hint}</div>
          <button class="audio-icon" type="button" style="margin-top:6px" aria-label="Hear sample for ${sym.z}" onclick="speakZhuyinSymbol('${l.id}',${sectionIdx},${symIdx})">🔊</button>
        </div>`).join('')}
      </div>
    </div>`;
    return '';
  }).join('');

  b.innerHTML = html + (l.drill ? `
    <div style="margin-top:24px;text-align:center">
      <button class="btn" onclick="setZTab('drill')" style="padding:12px 32px;font-size:15px">Start Drill →</button>
    </div>` : '');
}

function renderZDrill(b, l){
  if(!l.drill){ b.innerHTML='<p>No drill for this lesson.</p>'; return; }
  const items = l.drill.items;

  if(zDrillDone){
    const pct = Math.round(zDrillScore/items.length*100);
    const emoji = pct>=90?'🎉':pct>=70?'👍':pct>=50?'📖':'🔄';
    saveProgress('z_'+l.id,'drillBest',Math.max(zDrillScore,getLessonProgress('z_'+l.id).drillBest||0));
    renderSidebar();
    b.innerHTML=`<div class="quiz-done">
      <div class="emoji">${emoji}</div>
      <div class="score-big">${zDrillScore} / ${items.length}</div>
      <div class="score-label">${pct}% · ${pct>=90?'Excellent! 很棒！':pct>=70?'Good! 不錯！':pct>=50?'Keep going!':'Review and retry!'}</div>
      <button class="btn" onclick="restartZDrill()" style="margin-right:8px">Try Again</button>
      <button class="btn-ghost" onclick="setZTab('learn')">← Back to Lesson</button>
    </div>`;
    return;
  }

  const q = items[zDrillIdx];
  const opts = q.options || [q.correct,'—','—','—'];
  const isDesc = l.drill.type==='tone-match'; // shows description instead of symbol

  b.innerHTML=`<div class="quiz-wrap">
    <div class="quiz-meta">
      <span>${l.drill.prompt}</span>
      <span class="quiz-score">✓ ${zDrillScore} / ${zDrillIdx} correct · Q${zDrillIdx+1}/${items.length}</span>
    </div>
    <div class="quiz-q-card" style="min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center">
      ${isDesc
        ? `<div style="font-size:17px;line-height:1.6;color:var(--text);text-align:center;padding:0 10px">${q.desc}</div>`
        : `<div style="font-size:52px;font-family:'BiauKai','DFKai-SB',serif;line-height:1.2;margin-bottom:6px">${q.z}</div>`
      }
      ${!isDesc||/[㐀-鿿]/.test(q.desc||'')?`<button type="button" class="audio-icon" onclick="speakZDrill()">🔊 Hear example</button>`:''}
    </div>
    ${opts.map(opt=>{
      let cls='quiz-opt';
      if(zDrillAns){
        if(opt===q.correct) cls+=' correct';
        else if(opt===zDrillAns&&opt!==q.correct) cls+=' wrong';
      }
      return `<button class="${cls}" onclick="answerZDrill('${opt.replace(/'/g,"\\'")}')" ${zDrillAns?'disabled':''}>${opt}</button>`;
    }).join('')}
  </div>`;
}

// ============================================================
// ZHUYIN ACTIONS
// ============================================================
function openZLesson(id){
  stopAudio();closeMobileNav();zSection='zhuyin'; currentZLesson=id; zTab='learn';
  zDrillIdx=0; zDrillAns=null; zDrillScore=0; zDrillDone=false;
  render();
}
function setZTab(t){
  stopAudio();zTab=t;
  if(t==='drill'){ zDrillIdx=0; zDrillAns=null; zDrillScore=0; zDrillDone=false; }
  render();
}
function restartZDrill(){ zDrillIdx=0; zDrillAns=null; zDrillScore=0; zDrillDone=false; renderBody(); }
function answerZDrill(ans){
  if(zDrillAns) return;
  const l = ZHUYIN_LESSONS.find(x=>x.id===currentZLesson);
  const q = l.drill.items[zDrillIdx];
  zDrillAns=ans;
  if(ans===q.correct) zDrillScore++;
  renderBody();
  setTimeout(()=>{
    if(zDrillIdx+1>=l.drill.items.length){ zDrillDone=true; }
    else{ zDrillIdx++; zDrillAns=null; }
    renderBody();
  }, 900);
}

// Start
render();
if('speechSynthesis' in window){speechSynthesis.addEventListener?.('voiceschanged',refreshVoiceChoices);refreshVoiceChoices();}
</script>
